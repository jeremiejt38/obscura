name: Bug report
description: Report reproducible unexpected behavior
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private screenshots or image content."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Obscura version
      placeholder: "vX.Y.Z"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, desktop environment and clipboard backend"
