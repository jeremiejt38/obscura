name: Release binaries

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: obscura-linux
            asset: obscura-linux
            data_separator: ":"
          - os: windows-latest
            artifact: obscura-windows
            asset: obscura-windows.exe
            data_separator: ";"
          - os: macos-latest
            artifact: obscura-macos
            asset: obscura-macos
            data_separator: ":"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --onefile --windowed --add-data "obscura.svg${{ matrix.data_separator }}." --name ${{ matrix.artifact }} scripts/obscura_desktop.py
      - run: python -c "import hashlib,pathlib; p=pathlib.Path('dist/${{ matrix.asset }}'); pathlib.Path(f'{p}.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
