[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obscura"
version = "0.2.0"
description = "Offline screenshot redaction using local OCR"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jeremie" }]
keywords = ["privacy", "ocr", "redaction", "screenshot", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "watchdog>=3.0.0",
    "PySide6>=6.11.1",
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
obscura = "obscura.main:main"
obscura-desktop = "obscura.desktop:main"

[project.urls]
Homepage = "https://github.com/jeremiejt38/Obscura"
Repository = "https://github.com/jeremiejt38/Obscura"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["obscura*"]
